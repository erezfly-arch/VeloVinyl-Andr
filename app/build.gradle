plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.erezfly.velovinyl'
    compileSdk 35

    defaultConfig {
        applicationId 'com.erezfly.velovinyl'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    dependencies {\n        implementation 'org.osmdroid:osmdroid-android:6.1.20'\n        implementation 'androidx.core:core-ktx:1.15.0'\n    }\n\n    buildTypes {
        release { minifyEnabled false }
    }
}
